name: Upstream Sync

on:
  schedule:
    - cron: '0 0 * * *' # 每天北京时间早上 8 点自动同步
  workflow_dispatch: # 允许手动点击按钮触发

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write # 需要写入权限以推送更新

    steps:
      - name: Checkout target repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Git configuration
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'

      - name: Pull upstream changes
        run: |
          # 添加源仓库地址（请把下面 URL 换成你的源仓库链接）
          git remote add upstream https://github.com/huangxd-/danmu_api.git
          git fetch upstream
          
          # 尝试将源仓库的 main 分支合并到你当前仓库的 main 分支
          git checkout main
          git merge upstream/main --allow-unrelated-histories || echo "Merge conflict or already up to date"
          
          # 推送到你的 GitHub 仓库
          git push origin main || echo "Push failed or nothing to commit"
